<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<title>Teleprompter</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #111; color: #fff; font-family: -apple-system, Helvetica, Arial, sans-serif; }
  #setup { padding: 16px; max-width: 600px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 8px 0 12px; }
  textarea { width: 100%; height: 150px; font-size: 16px; padding: 10px; border-radius: 10px; border: none; }
  label { display: block; margin: 12px 0 4px; font-size: 14px; color: #bbb; }
  select, input[type=range] { width: 100%; font-size: 16px; }
  select { padding: 10px; border-radius: 10px; }
  button { font-size: 17px; padding: 14px 18px; border: none; border-radius: 12px; background: #0a84ff; color: #fff; margin-top: 14px; width: 100%; }
  button.red { background: #ff3b30; }
  button.gray { background: #444; }
  #stage { display: none; position: fixed; inset: 0; background: #000; flex-direction: column; align-items: center; justify-content: center; }
  #frame { position: relative; overflow: hidden; background: #000; max-width: 100vw; max-height: 78vh; }
  video#cam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  #prompt { position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden; pointer-events: none; }
  #textbox { position: absolute; left: 0; right: 0; padding: 0 6%; text-align: center; font-weight: 700; line-height: 1.35; text-shadow: 0 0 6px #000, 0 0 12px #000; white-space: pre-wrap; }
  #bar { width: 100%; padding: 10px 14px; display: flex; gap: 10px; background: #111; }
  #bar button { margin: 0; flex: 1; padding: 12px; }
  #playback { display: none; max-width: 100%; max-height: 70vh; }
</style>
</head>
<body>

<div id="setup">
  <h1>Teleprompter com gravação</h1>
  <label>Seu roteiro</label>
  <textarea id="script" placeholder="Cole aqui o texto do seu vídeo..."></textarea>

  <label>Formato do vídeo</label>
  <select id="format">
    <option value="9:16">Vertical 9:16 (Reels, TikTok, Shorts)</option>
    <option value="1:1">Quadrado 1:1</option>
    <option value="16:9">Horizontal 16:9 (YouTube)</option>
  </select>

  <label>Velocidade do texto: <span id="spdv">40</span></label>
  <input type="range" id="speed" min="10" max="150" value="40">

  <label>Tamanho da letra: <span id="szv">32</span></label>
  <input type="range" id="size" min="20" max="70" value="32">

  <label>Câmera</label>
  <select id="facing">
    <option value="user">Frontal (selfie)</option>
    <option value="environment">Traseira</option>
  </select>

  <label><input type="checkbox" id="mirror"> Espelhar o texto (para usar com vidro de teleprompter)</label>

  <button id="start">Iniciar câmera</button>
</div>

<div id="stage">
  <div id="frame">
    <video id="cam" autoplay playsinline muted></video>
    <div id="prompt"><div id="textbox"></div></div>
  </div>
  <video id="playback" controls playsinline></video>
  <div id="bar">
    <button id="rec" class="red">Gravar</button>
    <button id="back" class="gray">Voltar</button>
  </div>
  <div id="saveBar" style="display:none; width:100%; padding:10px 14px; background:#111;">
    <button id="save">Salvar vídeo</button>
    <button id="again" class="gray">Gravar de novo</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let stream, recorder, chunks = [], recording = false, raf, pos = 0, lastT = 0, blobUrl = null, mime = '';

$('speed').oninput = e => $('spdv').textContent = e.target.value;
$('size').oninput = e => $('szv').textContent = e.target.value;

function pickMime() {
  const opts = ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
  for (const o of opts) { if (window.MediaRecorder && MediaRecorder.isTypeSupported(o)) return o; }
  return '';
}

function sizeFrame() {
  const f = $('format').value.split(':').map(Number);
  const ratio = f[0] / f[1];
  const maxW = window.innerWidth;
  const maxH = window.innerHeight * 0.78;
  let w = maxW, h = w / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  $('frame').style.width = w + 'px';
  $('frame').style.height = h + 'px';
}

async function startCamera() {
  const f = $('format').value;
  const dims = { '9:16': {width: 1080, height: 1920}, '1:1': {width: 1080, height: 1080}, '16:9': {width: 1920, height: 1080} }[f];
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: $('facing').value, width: {ideal: dims.width}, height: {ideal: dims.height}, aspectRatio: {ideal: dims.width / dims.height} },
      audio: true
    });
  } catch (err) {
    alert('Não consegui abrir a câmera. Verifique se permitiu o acesso e se o endereço começa com https.');
    return;
  }
  $('cam').srcObject = stream;
  $('cam').style.transform = $('facing').value === 'user' ? 'scaleX(-1)' : 'none';
  $('setup').style.display = 'none';
  $('stage').style.display = 'flex';
  $('playback').style.display = 'none';
  $('frame').style.display = 'block';
  $('bar').style.display = 'flex';
  $('saveBar').style.display = 'none';
  sizeFrame();
  prepareText();
}

function prepareText() {
  const tb = $('textbox');
  tb.textContent = $('script').value || 'Escreva seu roteiro na tela inicial.';
  tb.style.fontSize = $('size').value + 'px';
  tb.style.transform = $('mirror').checked ? 'scaleX(-1)' : 'none';
  pos = $('frame').clientHeight * 0.55;
  tb.style.top = pos + 'px';
}

function loop(t) {
  if (!recording) return;
  const dt = (t - lastT) / 1000; lastT = t;
  pos -= Number($('speed').value) * dt;
  const tb = $('textbox');
  tb.style.top = pos + 'px';
  if (pos < -tb.offsetHeight) { stopRec(); return; }
  raf = requestAnimationFrame(loop);
}

function startRec() {
  mime = pickMime();
  chunks = [];
  try { recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
  catch (e) { alert('Seu navegador não conseguiu iniciar a gravação.'); return; }
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = showResult;
  prepareText();
  recorder.start();
  recording = true;
  $('rec').textContent = 'Parar';
  lastT = performance.now();
  raf = requestAnimationFrame(loop);
}

function stopRec() {
  if (!recording) return;
  recording = false;
  cancelAnimationFrame(raf);
  $('rec').textContent = 'Gravar';
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}

function showResult() {
  const type = (recorder && recorder.mimeType) || mime || 'video/mp4';
  const blob = new Blob(chunks, { type });
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(blob);
  $('frame').style.display = 'none';
  $('bar').style.display = 'none';
  const pb = $('playback');
  pb.src = blobUrl;
  pb.style.display = 'block';
  $('saveBar').style.display = 'block';
  window._blob = blob;
}

$('start').onclick = startCamera;
$('rec').onclick = () => recording ? stopRec() : startRec();
$('back').onclick = () => {
  stopRec();
  if (stream) stream.getTracks().forEach(t => t.stop());
  $('stage').style.display = 'none';
  $('setup').style.display = 'block';
};
$('again').onclick = startCamera;
$('save').onclick = async () => {
  const blob = window._blob;
  const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
  const file = new File([blob], 'video-teleprompter.' + ext, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) {}
  }
  const a = document.createElement('a');
  a.href = blobUrl; a.download = file.name; a.click();
};
window.addEventListener('resize', sizeFrame);
</script>
</body>
</html>
